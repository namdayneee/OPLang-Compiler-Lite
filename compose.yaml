services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:10000"

    environment:
      OPLANG_ALLOWED_ORIGINS: http://localhost:5173
      OPLANG_MAX_SOURCE_BYTES: "102400"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/api/v1/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  web:
    image: node:22-alpine

    working_dir: /app

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    command: >
      sh -c "
      npm ci &&
      npm run dev -- --host 0.0.0.0
      "

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000

    depends_on:
      api:
        condition: service_healthy


volumes:
  frontend_node_modules: