services:
  api:
    build: .
    ports:
      - "8000:10000"
    environment:
      OPLANG_ALLOWED_ORIGINS: http://localhost:5173
      OPLANG_MAX_SOURCE_BYTES: 102400

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
